<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Solar Depot — Admin Dashboard</title>
    <meta name="description" content="Solar Depot administrative dashboard for managing products, categories, solutions, projects, and enquiries." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#071B2A" />
  </head>
  <body class="bg-[#F7FAFC] text-navy antialiased selection:bg-electric-500/20 selection:text-electric-700">
    <div id="root">
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background-color: #F7FAFC; color: #64748b; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;">
          <div style="position: absolute; width: 52px; height: 52px; border-radius: 50%; background: rgba(2, 151, 222, 0.08);"></div>
          <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(2, 151, 222, 0.2); border-top-color: #0297DE; animation: solarSpin 0.8s linear infinite;"></div>
        </div>
        <p style="margin: 0; font-size: 13px; font-weight: 500; color: #94a3b8;">Loading Solar Depot...</p>
        <style>
          @keyframes solarSpin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
